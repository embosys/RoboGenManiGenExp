[project]
name = "robogen-manigen-exp"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "gym==0.21.0",
    "ray==1.13.0",
    "protobuf==3.20.0",
    "tensorboardX==2.5.1",
    "dm-tree==0.1.8",
    "lz4==4.0.0",
    "tabulate==0.8.10",
    "scikit-image==0.19.3",
    "numpy==1.23.5",
    "scipy==1.9.1",
    "PyYAML==6.0",
    "trimesh==3.20.2",
    "moviepy==1.0.3",
    "objaverse==0.0.7",
    "openai==0.27.8",
    "open3d==0.14.1",
    "pybullet==3.2.7",
    "mujoco==3.3.7",
    "torch==2.0.0",
    "setuptools==65.5.0",
    "python-dotenv>=1,<2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
build-constraint-dependencies = ["setuptools==65.5.0", "wheel==0.38.4"]

# Gym 0.21 has an invalid optional OpenCV requirement in its original metadata.
[[tool.uv.dependency-metadata]]
name = "gym"
version = "0.21.0"
requires-dist = ["numpy>=1.18.0", "cloudpickle>=1.2.0", "importlib-metadata>=4.8.1; python_version < '3.10'"]

[dependency-groups]
ompl-build = ["pygccxml==2.2.1", "pyplusplus==1.8.5"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# gRPC 1.43 bundles an old zlib that conflicts with modern macOS SDK headers.
[tool.uv.extra-build-variables]
grpcio = { GRPC_PYTHON_BUILD_SYSTEM_ZLIB = "1" }
# Include stdio before old bundled zlib defines its fdopen compatibility macro.
pybullet = { CFLAGS = "-include stdio.h" }
